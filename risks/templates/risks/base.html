<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Risk Register{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #6b7280;
      --border: #d1d5db;
      --low: #86efac;
      --medium: #fde047;
      --high: #fdba74;
      --critical: #fca5a5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18181b;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --border: #3f3f46;
        --low: #14532d;
        --medium: #713f12;
        --high: #7c2d12;
        --critical: #7f1d1d;
      }
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      margin: 0;
      padding: 2rem;
    }
    nav a {
      color: var(--fg);
      text-decoration: none;
      margin-right: 1.25rem;
      font-size: 0.9rem;
      opacity: 0.7;
    }
    nav a:hover { opacity: 1; text-decoration: underline; }
    h1 { margin-top: 1.75rem; }

    /* Shared across heatmap.html and register.html */
    .band-low { background: var(--low); }
    .band-medium { background: var(--medium); }
    .band-high { background: var(--high); }
    .band-critical { background: var(--critical); }
    a.row-link { color: inherit; text-decoration: none; }
    a.row-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'risks:heatmap' %}">Heatmap</a>
    <a href="{% url 'risks:register' %}">Register</a>
    <a href="{% url 'risks:new_risk' %}">New Risk</a>
    <a href="{% url 'risks:ai_settings' %}">AI Settings</a>
    <a href="/admin/">Django Admin</a>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
